name: Android CI

on:
  push:
    branches: [ main, feature/private-storage-profiles ]
  pull_request:
    branches: [ main, feature/private-storage-profiles ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare persistent signing key
        run: |
          mkdir -p .ci
          base64 --decode .ci/dash-launcher-debug.keystore.b64 > .ci/dash-launcher-debug.keystore

      - name: Run catalog and download-provider validation tests
        run: gradle :app:testDebugUnitTest

      - name: Build optimized release and generate Baseline Profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: gradle :app:assembleRelease

      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: dash-launcher-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
